[project]
name = "idx-bei"
version = "0.2.0"
description = "IDX-BEI Quantitative Data & Analysis Toolkit"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13"
dependencies = [
    "arelle-release>=2.37.33",
    "matplotlib>=3.10.3",
    "neo4j>=5.28.1",
    "psycopg2-binary",
    "scikit-learn>=1.6.1",
    "seaborn>=0.13.2",
    "sqlalchemy>=2.0.41",
    "tqdm>=4.67.1",
    "yfinance>=0.2.59",
    "curl_cffi>=0.15.0",
    "python-dotenv>=1.0.1",
    "pyarrow>=18.0.0",
    "duckdb>=1.5.5",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
    "nbformat>=5.10.4",
    "pytest>=9.1.1",
    "ruff>=0.8.0",
]

[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (import sorting)
    "B",   # flake8-bugbear (common bug patterns)
    "UP",  # pyupgrade (modernize syntax)
]
ignore = [
    "E501", # line length handled by formatter; notebooks/scripts vary
]

[tool.ruff.lint.per-file-ignores]
# Tests may adjust sys.path before importing modules under test
"tests/*" = ["E402"]
