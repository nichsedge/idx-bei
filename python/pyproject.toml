[project]
name = "idx-bei"
version = "0.2.0"
description = "IDX-BEI Quantitative Data & Analysis Toolkit"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13"
dependencies = [
    "neo4j>=5.28.1",
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "tqdm>=4.67.1",
    "curl_cffi>=0.15.0",
    "python-dotenv>=1.0.1",
    "pyarrow>=18.0.0",
    "duckdb>=1.5.5",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pypdf>=5.0",
    "pytesseract>=0.3.13",
    "pypdfium2>=4.30",
]

[project.scripts]
idx = "idx.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "ipykernel>=7.3.0",
    "mypy>=1.15.0",
    "nbformat>=5.10.4",
    "pytest>=9.1.1",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (import sorting)
    "B",   # flake8-bugbear (common bug patterns)
    "UP",  # pyupgrade (modernize syntax)
]
ignore = [
    "E501", # line length handled by formatter; notebooks/scripts vary
]

[tool.ruff.lint.per-file-ignores]
# Tests may adjust sys.path before importing modules under test
"tests/*" = ["E402"]

[tool.mypy]
python_version = "3.13"
warn_unused_configs = true
check_untyped_defs = true
ignore_missing_imports = true
follow_imports = "silent"

[tool.coverage.run]
source = ["src/idx"]
omit = [
    "src/idx/mcp/*",
    "src/idx/cli.py",
    "src/idx/scrapers/*",
]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
