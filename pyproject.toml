[project]
name = "idx-bei-root"
version = "0.2.0"
description = "IDX-BEI Quantitative Data & Analysis Toolkit"
readme = "README.md"
requires-python = ">=3.14.7"
dependencies = [
    "idx-bei",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.5",
]

[tool.uv.sources]
idx-bei = { workspace = true }

[tool.uv.workspace]
members = ["python"]

[tool.pytest.ini_options]
pythonpath = ["python/src", "python"]

