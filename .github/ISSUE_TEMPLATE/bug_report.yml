name: Bug Report
description: Create a report to help us reproduce and fix an issue
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting an issue to the IDX-BEI Toolkit! Please provide sufficient details to reproduce it.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: What commands or code did you run?
      placeholder: |
        1. Run `uv run idx signals`
        2. Encountered error ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Error Traceback / Logs
      description: Please paste the full terminal output or traceback.
      render: shell
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS version, Python version, uv version.
      placeholder: "Linux / macOS / Windows, Python 3.13.x, uv 0.5.x"
    validations:
      required: true
