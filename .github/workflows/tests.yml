name: tests

on:
  push:
    branches: [main]
    paths:
      - "python/**"
      - ".github/workflows/tests.yml"
  pull_request:
    paths:
      - "python/**"
      - ".github/workflows/tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint (ruff)
        run: uv run ruff check src tests cli.py

      - name: Run tests (pytest)
        run: uv run pytest -q
