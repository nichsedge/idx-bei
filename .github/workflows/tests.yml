name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint (ruff)
        run: uv run ruff check python/src python/tests python/cli.py

      - name: Static Type Checking (mypy)
        run: uv run mypy python/src/idx

      - name: Run tests with coverage enforcement (pytest-cov >= 85%)
        run: uv run pytest python/tests --cov=idx --cov-fail-under=85
